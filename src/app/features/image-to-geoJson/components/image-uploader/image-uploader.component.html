<!-- image-uploader.component.html -->
<div class="container-fluid">
  <div class="row">
    <div class="col-12 col-md-12 mb-4">
      <div class="upload-container">
        <input
          #fileInput
          type="file"
          class="file-input"
          (change)="onFileSelected($event)"
          accept="image/*"
          [class.disabled]="isTracing"
        />
        <div class="upload-content" (click)="fileInput.click()">
          <i class="material-icons">cloud_upload</i>
          <span>Click to upload an image</span>
          <small *ngIf="selectedFile">Selected: {{ selectedFile.name }}</small>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-12 mb-4">
      <div class="options-container">
        <div class="option">
          <label>
            Threshold
            <input
              type="range"
              min="1"
              max="255"
              [(ngModel)]="traceOptions.threshold"
              [disabled]="isTracing"
            />
            <span class="badge bg-secondary">{{ traceOptions.threshold }}</span>
          </label>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-12">
      <div class="row">
        <!-- Shape Preview -->
        <div class="col-12 preview-container">
          <div class="preview-header">
            <i class="material-icons">preview</i>
            <span>Shape Preview</span>
          </div>
          <router-outlet name="preview"></router-outlet>
        </div>
      </div>
    </div>
  </div>
</div>
