<div class="editor-container">
  <h3>GeoJSON Editor</h3>
  <div class="editor-wrapper">
    <ngx-monaco-editor
      class="monaco-editor"
      [options]="editorOptions"
      [(ngModel)]="code"
      (ngModelChange)="onCodeChanged($event)"
      (onInit)="onEditorInit($event)"
      style="height: 400px; width: 100%"
    ></ngx-monaco-editor>
  </div>
</div>
