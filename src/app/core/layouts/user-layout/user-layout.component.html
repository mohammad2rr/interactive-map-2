<div
  class="d-flex flex-column min-vh-100 overflow-hidden"
  [class.bg-dark]="themeService.isDarkMode()"
  [class.text-light]="themeService.isDarkMode()"
>
  <header
    class="bg-white shadow-sm sticky-top"
    [class.bg-dark]="themeService.isDarkMode()"
    [class.border-bottom]="!themeService.isDarkMode()"
    [class.border-secondary]="themeService.isDarkMode()"
  >
    <nav
      class="navbar navbar-expand-lg"
      [class.navbar-light]="!themeService.isDarkMode()"
      [class.navbar-dark]="themeService.isDarkMode()"
    >
      <div class="container-fluid px-4">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="#"
        >
          <span class="fs-4">🗺️</span>
          <span>Interactive Map</span>
        </a>
        <div class="d-flex align-items-center gap-3">
          <button
            class="btn btn-icon"
            [class.btn-outline-secondary]="!themeService.isDarkMode()"
            [class.btn-outline-light]="themeService.isDarkMode()"
            (click)="toggleTheme()"
          >
            <span class="fs-5">{{
              themeService.isDarkMode() ? "🌙" : "☀️"
            }}</span>
          </button>
          <button
            class="navbar-toggler border-0"
            type="button"
            (click)="toggleSidebar()"
            [attr.aria-expanded]="isSidebarOpen"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="d-none d-md-flex align-items-center gap-2">
            <span class="fw-medium">John Doe</span>
            <img
              src="assets/images/avatar.jpg"
              alt="User Avatar"
              class="rounded-circle border"
              style="width: 40px; height: 40px; object-fit: cover"
            />
          </div>
        </div>
      </div>
    </nav>
  </header>

  <div class="d-flex flex-grow-1 position-relative">
    <aside
      class="bg-light border-end position-fixed h-100"
      [class.bg-dark]="themeService.isDarkMode()"
      [class.border-secondary]="themeService.isDarkMode()"
      [style.transform]="!isSidebarOpen ? 'translateX(-100%)' : 'translateX(0)'"
      style="
        width: 250px;
        transition: transform 0.3s ease;
        z-index: 1040;
        top: 0;
        left: 0;
      "
    >
      <nav class="nav flex-column p-3 gap-1">
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/dashboard"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">📊</span>
          <span class="d-none d-md-inline">Dashboard</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/maps"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">🗺️</span>
          <span class="d-none d-md-inline">My Maps</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/activity"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">📝</span>
          <span class="d-none d-md-inline">Activity</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/favorites"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">⭐</span>
          <span class="d-none d-md-inline">Favorites</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/shared"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">👥</span>
          <span class="d-none d-md-inline">Shared Maps</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/templates"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">📋</span>
          <span class="d-none d-md-inline">Templates</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/settings"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">⚙️</span>
          <span class="d-none d-md-inline">Settings</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/profile"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">👤</span>
          <span class="d-none d-md-inline">Profile</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/billing"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">💳</span>
          <span class="d-none d-md-inline">Billing</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2 rounded-3 px-3 py-2"
          routerLink="/user/blog"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
          [class.bg-primary]="!themeService.isDarkMode()"
          [class.bg-primary-subtle]="themeService.isDarkMode()"
        >
          <span class="fs-5">📚</span>
          <span class="d-none d-md-inline">Blog</span>
        </a>
      </nav>
    </aside>

    <main
      class="flex-grow-1 p-4"
      [style.margin-left]="!isMobile && isSidebarOpen ? '250px' : '0'"
      style="transition: margin-left 0.3s ease"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Overlay for mobile -->
<div
  class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50"
  *ngIf="isSidebarOpen && isMobile"
  (click)="toggleSidebar()"
  style="z-index: 1030; display: block"
></div>
