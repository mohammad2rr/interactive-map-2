<div class="user-layout">
  <header>
    <nav class="header-nav">
      <div class="logo">Interactive Map</div>
      <div class="user-controls">
        <button
          class="theme-toggle"
          (click)="toggleTheme()"
          [class.active]="themeService.isDarkMode()"
        >
          <span class="icon">{{
            themeService.isDarkMode() ? "🌙" : "☀️"
          }}</span>
        </button>
        <button class="menu-toggle" (click)="toggleSidebar()">
          <span class="hamburger"></span>
        </button>
        <span class="user-name">John Doe</span>
        <img src="assets/images/avatar.jpg" alt="User Avatar" class="avatar" />
      </div>
    </nav>
  </header>
  <div class="layout-content">
    <aside class="user-sidebar" [class.collapsed]="!isSidebarOpen">
      <nav class="sidebar-nav">
        <a routerLink="/user/dashboard" routerLinkActive="active">
          <i class="icon">📊</i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/user/maps" routerLinkActive="active">
          <i class="icon">🗺️</i>
          <span>My Maps</span>
        </a>
        <a routerLink="/user/activity" routerLinkActive="active">
          <i class="icon">📝</i>
          <span>Activity</span>
        </a>
        <a routerLink="/user/favorites" routerLinkActive="active">
          <i class="icon">⭐</i>
          <span>Favorites</span>
        </a>
        <a routerLink="/user/shared" routerLinkActive="active">
          <i class="icon">👥</i>
          <span>Shared Maps</span>
        </a>
        <a routerLink="/user/templates" routerLinkActive="active">
          <i class="icon">📋</i>
          <span>Templates</span>
        </a>
        <a routerLink="/user/settings" routerLinkActive="active">
          <i class="icon">⚙️</i>
          <span>Settings</span>
        </a>
        <a routerLink="/user/profile" routerLinkActive="active">
          <i class="icon">👤</i>
          <span>Profile</span>
        </a>
        <a routerLink="/user/billing" routerLinkActive="active">
          <i class="icon">💳</i>
          <span>Billing</span>
        </a>
        <a routerLink="/user/blog" routerLinkActive="active">
          <i class="icon">📚</i>
          <span>Blog</span>
        </a>
      </nav>
    </aside>
    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
