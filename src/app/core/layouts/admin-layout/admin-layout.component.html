<div
  class="d-flex flex-column min-vh-100"
  [class.bg-dark]="themeService.isDarkMode()"
  [class.text-light]="themeService.isDarkMode()"
>
  <header
    class="bg-white shadow-sm"
    [class.bg-dark]="themeService.isDarkMode()"
    [class.border-bottom]="!themeService.isDarkMode()"
    [class.border-secondary]="themeService.isDarkMode()"
  >
    <nav
      class="navbar navbar-expand-lg"
      [class.navbar-light]="!themeService.isDarkMode()"
      [class.navbar-dark]="themeService.isDarkMode()"
    >
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Admin Panel</a>
        <div class="d-flex align-items-center gap-3">
          <button
            class="btn"
            [class.btn-outline-secondary]="!themeService.isDarkMode()"
            [class.btn-outline-light]="themeService.isDarkMode()"
            (click)="toggleTheme()"
          >
            <span>{{ themeService.isDarkMode() ? "🌙" : "☀️" }}</span>
          </button>
          <button
            class="navbar-toggler"
            type="button"
            (click)="toggleSidebar()"
            [attr.aria-expanded]="isSidebarOpen"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <span class="d-none d-md-inline">Admin</span>
          <img
            src="assets/images/admin-avatar.jpg"
            alt="Admin Avatar"
            class="rounded-circle"
            style="width: 40px; height: 40px; object-fit: cover"
          />
        </div>
      </div>
    </nav>
  </header>

  <div class="d-flex flex-grow-1 position-relative">
    <aside
      class="bg-light border-end position-fixed h-100"
      [class.bg-dark]="themeService.isDarkMode()"
      [class.border-secondary]="themeService.isDarkMode()"
      [style.transform]="!isSidebarOpen ? 'translateX(-100%)' : 'translateX(0)'"
      style="
        width: 250px;
        transition: transform 0.3s ease;
        z-index: 1040;
        top: 0;
        left: 0;
      "
    >
      <nav class="nav flex-column p-3">
        <a
          class="nav-link d-flex align-items-center gap-2"
          routerLink="/admin/dashboard"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
        >
          <span>📊</span>
          <span class="d-none d-md-inline">Dashboard</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2"
          routerLink="/admin/users"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
        >
          <span>👥</span>
          <span class="d-none d-md-inline">Users</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2"
          routerLink="/admin/content"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
        >
          <span>📝</span>
          <span class="d-none d-md-inline">Content</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2"
          routerLink="/admin/maps"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
        >
          <span>🗺️</span>
          <span class="d-none d-md-inline">Maps</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2"
          routerLink="/admin/settings"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
        >
          <span>⚙️</span>
          <span class="d-none d-md-inline">Settings</span>
        </a>
        <a
          class="nav-link d-flex align-items-center gap-2"
          routerLink="/admin/blog"
          routerLinkActive="active"
          [class.text-light]="themeService.isDarkMode()"
          [class.text-dark]="!themeService.isDarkMode()"
        >
          <span>📚</span>
          <span class="d-none d-md-inline">Blog</span>
        </a>
      </nav>
    </aside>

    <main
      class="flex-grow-1 p-4"
      [style.margin-left]="!isMobile && isSidebarOpen ? '250px' : '0'"
      style="transition: margin-left 0.3s ease"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Overlay for mobile -->
<div
  class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50"
  *ngIf="isSidebarOpen && isMobile"
  (click)="toggleSidebar()"
  style="z-index: 1030; display: block"
></div>
